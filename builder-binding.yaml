apiVersion: standards.spyroot.dev/v1alpha1
kind: ProjectProviderBinding
metadata:
  name: builder
spec:
  source:
    localPath: /Users/spyroot/dev/builder
    repository: https://gitlab.rnd.embedings.ai/spyroot/builder
    canonicalId: spyroot/builder
    revision: d3234c26f71f5a229bba28971d37ff38085c1da3
  contract:
    path: docs/agents/contracts/builder-provider.md
  discovery:
    command:
      - ./scripts/shared_inventory_map.sh
      - --validate
    resultBinding: .spec.providerCapabilities
  dispatch:
    authority: internal-gitlab
    baseUrl: https://gitlab.rnd.embedings.ai
    project: spyroot/builder
    transport: pipeline-api
    binding: standards.agent-workspace.provider
    requestSchema: provider-request/v1
    resultSchema: provider-result/v1
    protectedRefRequired: true
    runnerTag: homelab-k8s-protected
