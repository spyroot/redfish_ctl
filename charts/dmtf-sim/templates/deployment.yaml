{{- $bundleRoot := printf "/mockups/DSP2043_%s" .Values.dmtf.bundleRelease -}}
{{- $mockupDir := printf "%s/%s" $bundleRoot .Values.dmtf.profile -}}
{{- $sourceCommit := required "provenance.sourceCommit must be an exact 40-character commit SHA" .Values.provenance.sourceCommit -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: simulator
  annotations:
    dmtf.redfish.ctl.dev/bundle-release: {{ .Values.dmtf.bundleRelease | quote }}
    dmtf.redfish.ctl.dev/bundle-sha256: {{ .Values.dmtf.bundleSha256 | quote }}
    dmtf.redfish.ctl.dev/profile: {{ .Values.dmtf.profile | quote }}
    dmtf.redfish.ctl.dev/source-commit: {{ $sourceCommit | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: simulator
      annotations:
        dmtf.redfish.ctl.dev/bundle-release: {{ .Values.dmtf.bundleRelease | quote }}
        dmtf.redfish.ctl.dev/bundle-sha256: {{ .Values.dmtf.bundleSha256 | quote }}
        dmtf.redfish.ctl.dev/profile: {{ .Values.dmtf.profile | quote }}
        dmtf.redfish.ctl.dev/source-commit: {{ $sourceCommit | quote }}
    spec:
      serviceAccountName: {{ default .Release.Name .Values.serviceAccount.name }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . | quote }}
        {{- end }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dmtf-sim
          {{- if .Values.image.digest }}
          image: {{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}
          {{- else }}
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --host
            - 0.0.0.0
            - --port
            - {{ .Values.containerPort | quote }}
            - --mockup-dir
            - {{ $mockupDir | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /redfish/v1/
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /redfish/v1/
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
