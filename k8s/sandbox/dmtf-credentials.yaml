# Public demo credentials for the DMTF mockup simulator. The simulator accepts
# unauthenticated requests, but the controller must still exercise the
# secretRef -> Secret -> basic-auth path instead of constructing a connection
# with blank credentials.
apiVersion: v1
kind: Secret
metadata:
  name: dmtf-sim-credentials
  namespace: redfish-sandbox
  labels:
    app.kubernetes.io/name: dmtf-sim
    app.kubernetes.io/component: redfish-sandbox
type: Opaque
stringData:
  username: root
  password: calvin
