apiVersion: standards.spyroot.dev/v1alpha1
kind: ProjectStandardsBinding
metadata:
  name: redfish_ctl
spec:
  source:
    localPath: /Users/spyroot/dev/standards
    repository: https://gitlab.rnd.embedings.ai/spyroot/standards.git
    revision: 862d88ab1700827fa90f01cb8641950523147e4a
  requiredContracts:
    - ci
    - unit-testing
    - smoke-testing
    - blockers
    - agent-workspace
    - automation
    - project-consumer
    - provider-escalation
  providers:
    - name: builder
      binding: builder-binding.yaml
  projectAdditions:
    - TEAM_GUIDE.md
  exceptions: []
