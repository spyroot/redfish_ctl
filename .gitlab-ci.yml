# GitLab pipeline for the homelab platform. Every job runs on the self-managed `homelab-k8s` runner
# (Kubernetes executor: one disposable pod per job — the execution authority). Gates are driven from
# gates/manifest.yaml through scripts/check.sh. The meta-gate (tools/gate_meta.py) enforces
# that the required jobs exist, none uses allow_failure, every job carries the homelab-k8s tag, and no
# live-apply job is reachable from a merge-request pipeline.
#
# Job rules below isolate diagnostic, merge, integration, protected deployment,
# scheduled canary, and publication paths. Operator guidance lives in
# docs/external/ci.md.
include:
  - project: spyroot/builder
    ref: f210055901973997a4c6c1fbf1fff189aa871bd9
    file: /ci/templates/project-ci-resource-jobs.yml
  - project: spyroot/builder
    ref: bdf2c0c23332814075d7d3809ecffe09c37d1800
    file: /ci/templates/project-service.yml

stages: [project-ci-validation, validate, integration, deploy, publish]

# The shared toolbox image is the ONLY CI image. It supplies the runtime (conda,
# git-lfs, gate tools); this project supplies its dependencies via environment.yml.
# Registry and digest come from builder inventory/images/shared-images.yaml.
default:
  image: &builder-toolbox >-
    harbor.rnd.embedings.ai/spyroot/builder/toolbox@sha256:bba5761e8248eec533b270a4d16966f8440ba2a81287e7ff63907c8b3a483fc9
  tags: [homelab-k8s]
  before_script:
    # Corpora and the DMTF spec bundles are Git LFS; without this the suite runs
    # against pointer files and the bundle/corpus tests fail with BadZipFile/ReadError.
    - git lfs install --local && git lfs pull --include='tests/*_corpus.tar.gz,full_corpus/*.tar.gz,spec/dmtf/**/*.zip'
    # Bootstrap the project environment from its own declaration. conda env
    # create IS the dependency test: an unresolvable or malformed environment.yml
    # fails here, before any gate runs.
    - conda env create -q -f environment.yml || conda env update -q -f environment.yml --prune
    - eval "$(conda shell.bash hook)" && conda activate redfish_ctl

variables:
  # Direct exact-ref API pipelines need a full clone so changed-file gates can
  # compute their merge base against origin/main deterministically.
  GIT_DEPTH: "0"
  # Gates resolve pytest/ruff through the project environment, never a
  # pre-installed toolchain in the image.
  CONDA_ENV: redfish_ctl
  BUILDER_PROJECT_CONSUMER: redfish_ctl
  DMTF_RELEASE: "2026.1"
  PROJECT_LIVE_TEST_COMMAND: >-
    pytest -q -m dmtf_sim_live
    tests/k8s/test_dmtf_sim_live.py::test_dmtf_service_root
  # The exact Builder include invokes this project-owned selector. It chooses
  # one FOCUSED_GATE or the complete merge profile and nothing else.
  PROJECT_CI_CPU_COMMAND: ./scripts/project_ci_entrypoint.sh

.private-api-web:
  rules:
    - &private-api-web
      if: >-
        $CI_SERVER_HOST == "gitlab.rnd.embedings.ai" &&
        ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")

.focused-dispatch:
  rules:
    - &focused-dispatch
      if: >-
        $CI_SERVER_HOST == "gitlab.rnd.embedings.ai" &&
        ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") &&
        $FOCUSED_GATE != null && $FOCUSED_GATE != ""

.merge-profile-dispatch:
  rules:
    - &merge-profile-dispatch
      if: >-
        $CI_SERVER_HOST == "gitlab.rnd.embedings.ai" &&
        ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") &&
        ($FOCUSED_GATE == null || $FOCUSED_GATE == "") &&
        $MERGE_PROFILE == "merge"

focused-gate:
  stage: validate
  tags: [homelab-k8s]
  rules:
    - *focused-dispatch
    - when: never
  script:
    # A focused result proves only this gate at this commit. It is not merge or release evidence.
    - ./scripts/check.sh --profile merge --gate "${FOCUSED_GATE:-unit.all}"
  artifacts:
    when: always
    paths:
      - reports/gate-report.sanitized.json
      - reports/ci/focused-gate.json
      - reports/gates/

gate-merge:
  stage: validate
  tags: [homelab-k8s]
  rules:
    - <<: *focused-dispatch
      when: never
    - *merge-profile-dispatch
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - ./scripts/check.sh --list
    - ./scripts/check.sh --profile merge
  artifacts:
    when: always
    paths:
      - reports/gate-report.sanitized.json
      - reports/ci/gate-merge.json
      - reports/gates/
      - reports/smoke/gate-merge.json

gate-integration:
  stage: integration
  tags: [homelab-k8s]
  rules:
    - <<: *private-api-web
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  script:
    - ./scripts/check.sh --profile integration
  artifacts:
    when: always
    paths:
      - reports/gate-report.sanitized.json
      - reports/ci/gate-integration.json
      - reports/gates/
      - reports/smoke/gate-integration.json

# The exact-revision Builder include owns this job's runner, rules, and
# command. This local overlay owns only redfish_ctl evidence publication.
project-ci-cpu-validation:
  artifacts:
    when: always
    paths:
      - reports/ci/project-ci-cpu-validation.json
      - reports/gates/
      - reports/smoke/project-ci-cpu-validation.json

gate-scheduled:
  stage: integration
  tags: [homelab-k8s]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  script:
    - ./scripts/check.sh --profile scheduled
  artifacts:
    when: always
    paths:
      - reports/ci/gate-scheduled.json
      - reports/gates/
      - reports/smoke/gate-scheduled.json

# Live cluster checks run HERE, as a pipeline job on the in-cluster runner —
# never from a workstation. The runner pod already carries a ServiceAccount, so
# no kubeconfig or context is involved.
#
# Cluster-down is an expected state, not a failure of this project: the job
# reports UNAVAILABLE and succeeds, so an outage cannot red a pipeline that has
# nothing to do with the cluster. A cluster that IS up but answers wrongly does
# fail, because that is a real defect.
k8s-live-check:
  stage: integration
  tags: [homelab-k8s]
  rules:
    - <<: *private-api-web
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  before_script: []          # no project env needed; this probes the cluster only
  script:
    - |
      if ! kubectl version --request-timeout=10s >/dev/null 2>&1; then
        echo "k8s-live-check: UNAVAILABLE (API unreachable from the runner pod)"
        echo "  This is reported, not failed: cluster availability is not this project's gate."
        exit 0
      fi
      echo "k8s-live-check: cluster reachable"
      kubectl get nodes -o wide
      kubectl get crd 2>/dev/null | grep -i redfish || echo "(no redfish CRDs registered)"

# Builder owns publication, the immutable deploy plan, protected mutation, and
# exact-commit read-back. The consumer names each job so the provider template's
# artifact DAG remains closed and auditable.
project-service-image-publish:
  extends: .builder-project-image-publish
  stage: deploy
  image: *builder-toolbox
  tags: [homelab-k8s, homelab-k8s-protected]
  allow_failure: false
  before_script:
    - git lfs install --local
    - >-
      git lfs pull
      --include='spec/dmtf/redfish/2026.1/mockups/DSP2043_2026.1.zip'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: >-
        $CI_COMMIT_REF_PROTECTED == "true" &&
        $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
    - when: never

project-service-chart-publish:
  extends: .builder-project-chart-publish
  stage: deploy
  image: *builder-toolbox
  tags: [homelab-k8s, homelab-k8s-protected]
