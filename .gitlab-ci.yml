# DCloud runs the project-owned gate registry on its dedicated Kubernetes runners.
stages: [project-ci-validation, validate, integration, deploy, publish]

workflow:
  rules:
    - if: '$CI_SERVER_HOST == "gitlab.dcloud.run"'
    - when: never

default:
  image: >-
    harbor.dcloud.run/redfish_ctl/ci-toolbox@sha256:9007a2a023805a94d9906d8fffda6eb45ce6c9a4f468851423bb7556ee5cf531
  tags: [redfish_ctl, redfish_ctl-focused]
  before_script:
    - git remote add github-fixtures https://github.com/spyroot/redfish_ctl.git
    - unset GIT_LFS_SKIP_SMUDGE
    - git lfs install --local
    - git lfs fetch github-fixtures "$CI_COMMIT_SHA"
    - git lfs checkout
    - conda env create -q -f environment.yml
    - eval "$(conda shell.bash hook)" && conda activate redfish_ctl

variables:
  GIT_STRATEGY: clone
  GIT_DEPTH: "0"
  GIT_LFS_SKIP_SMUDGE: "1"
  GIT_TERMINAL_PROMPT: "0"
  CONDA_ENV: redfish_ctl
  PROJECT_CI_CPU_COMMAND: ./tools/project-ci-cpu-validation.sh
  REDFISH_CI_SERVER_HOST: gitlab.dcloud.run
  REDFISH_CI_PROJECT_PATH: spyroot/redfish_ctl
  REDFISH_STANDARDS_PACKAGE_API: https://gitlab.dcloud.run/api/v4
  REDFISH_BUILD_NAMESPACE: redfish-ctl-build
  REDFISH_SIM_NAMESPACE: redfish-ctl-simulator
  PROJECT_SERVICE_NAME: redfish-ctl-dmtf-sim
  REDFISH_SIM_VALUES_FILE: charts/dmtf-sim/values-dcloud.yaml
  REDFISH_HARBOR_PROJECT: harbor.dcloud.run/redfish_ctl
  REDFISH_HARBOR_BUILD_SECRET: redfish-harbor-build
  REDFISH_HARBOR_PULL_SECRET: redfish-harbor-pull

.private-api-web:
  rules:
    - &private-api-web
      if: >-
        $CI_SERVER_HOST == "gitlab.dcloud.run" &&
        ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")

.focused-dispatch:
  rules:
    - &focused-dispatch
      if: >-
        $CI_SERVER_HOST == "gitlab.dcloud.run" &&
        ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") &&
        $FOCUSED_GATE != null && $FOCUSED_GATE != ""

.merge-profile-dispatch:
  rules:
    - &merge-profile-dispatch
      if: >-
        $CI_SERVER_HOST == "gitlab.dcloud.run" &&
        ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") &&
        ($FOCUSED_GATE == null || $FOCUSED_GATE == "") &&
        $MERGE_PROFILE == "merge"

.project-ci-selector-deny:
  rules:
    - &project-ci-selector-deny
      if: >-
        ($FOCUSED_GATE != null && $FOCUSED_GATE != "") ||
        $MERGE_PROFILE == "merge" ||
        (($PROJECT_CI_PROFILE != null && $PROJECT_CI_PROFILE != "") &&
        $PROJECT_CI_PROFILE != "protected") ||
        ($PROJECT_CI_SMOKE != null && $PROJECT_CI_SMOKE != "")
      when: never

.protected-manual:
  rules: &protected-manual-rules
    - *project-ci-selector-deny
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: >-
        $CI_COMMIT_REF_PROTECTED == "true" &&
        $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
    - when: never

.protected-read:
  rules: &protected-read-rules
    - *project-ci-selector-deny
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: >-
        $CI_COMMIT_REF_PROTECTED == "true" &&
        $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
    - when: never

project-ci-cpu-validation:
  stage: project-ci-validation
  rules:
    - <<: *merge-profile-dispatch
      when: never
    - <<: *focused-dispatch
    - if: >-
        $CI_SERVER_HOST == "gitlab.dcloud.run" &&
        ($PROJECT_CI_PROFILE == "focused" || $PROJECT_CI_PROFILE == "full" ||
        $PROJECT_CI_SMOKE != null)
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      variables:
        PROJECT_CI_SMOKE: project-ci-cpu-validation
  script:
    - bash -lc "$PROJECT_CI_CPU_COMMAND"
  artifacts:
    when: always
    paths:
      - reports/ci/project-ci-cpu-validation.json
      - reports/gates/
      - reports/smoke/project-ci-cpu-validation.json

gate-merge:
  stage: validate
  rules:
    - if: >-
        $PROJECT_CI_PROFILE == "focused" || $PROJECT_CI_PROFILE == "full" ||
        ($PROJECT_CI_SMOKE != null && $PROJECT_CI_SMOKE != "")
      when: never
    - <<: *focused-dispatch
      when: never
    - *merge-profile-dispatch
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables:
    REDFISH_COVERAGE_REPORT: "true"
  script:
    - ./scripts/check.sh --list
    - ./scripts/check.sh --profile merge
    - COVERAGE_FILE=reports/tests/.coverage coverage report
  coverage: '/^TOTAL\s+.*\s+(\d+(?:\.\d+)?%)$/'
  artifacts:
    when: always
    paths:
      - reports/ci/gate-merge.json
      - reports/gates/
      - reports/smoke/gate-merge.json
      - reports/tests/commit.txt
      - reports/tests/junit.xml
      - reports/tests/coverage.xml
    reports:
      junit: reports/tests/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: reports/tests/coverage.xml

gate-integration:
  stage: integration
  tags: &protected-tags [redfish_ctl, redfish_ctl-protected]
  rules:
    - <<: *private-api-web
      when: never
    - if: >-
        $CI_COMMIT_REF_PROTECTED == "true" &&
        $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH &&
        $CI_PIPELINE_SOURCE == "schedule"
    - if: >-
        $CI_COMMIT_REF_PROTECTED == "true" &&
        $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - export GITLAB_URL="$CI_SERVER_URL" GITLAB_PROJECT_ID="$CI_PROJECT_ID"
    - ./scripts/check.sh --profile integration
  artifacts:
    when: always
    paths:
      - reports/ci/gate-integration.json
      - reports/gates/
      - reports/smoke/gate-integration.json

gate-scheduled:
  stage: integration
  tags: *protected-tags
  rules:
    - if: >-
        $CI_COMMIT_REF_PROTECTED == "true" &&
        $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH &&
        $CI_PIPELINE_SOURCE == "schedule"
  script:
    - ./scripts/check.sh --profile scheduled
  artifacts:
    when: always
    paths:
      - reports/ci/gate-scheduled.json
      - reports/gates/
      - reports/smoke/gate-scheduled.json

k8s-live-check:
  stage: integration
  tags: *protected-tags
  rules:
    - <<: *private-api-web
      when: never
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script: []
  script:
    - kubectl get --raw=/readyz
    - kubectl -n "$REDFISH_SIM_NAMESPACE" get services

project-service-image-publish:
  stage: deploy
  tags: *protected-tags
  allow_failure: false
  rules: *protected-manual-rules
  resource_group: redfish-sim-image-$CI_COMMIT_SHA
  script:
    - python tools/dcloud_simulator.py publish-image --apply
  artifacts:
    paths: [reports/simulator/image.json]

project-service-chart-publish:
  stage: deploy
  tags: *protected-tags
  allow_failure: false
  rules: *protected-manual-rules
  resource_group: redfish-sim-chart-$CI_COMMIT_SHA
  script:
    - python tools/dcloud_simulator.py publish-chart --apply
  artifacts:
    paths: [reports/simulator/chart.json]

project-service-deploy-plan:
  stage: deploy
  tags: *protected-tags
  allow_failure: false
  rules: *protected-read-rules
  needs: [project-service-image-publish, project-service-chart-publish]
  script:
    - python tools/dcloud_simulator.py plan
  artifacts:
    paths: [reports/simulator/plan.json]

project-service-deploy:
  stage: deploy
  tags: *protected-tags
  allow_failure: false
  rules: *protected-manual-rules
  needs: [project-service-image-publish, project-service-chart-publish, project-service-deploy-plan]
  resource_group: redfish-ctl-dmtf-sim
  variables:
    MUTATION_LOCK: redfish-ctl-dmtf-sim
  script:
    - python tools/dcloud_simulator.py apply --apply
  artifacts:
    when: always
    paths: [reports/simulator/apply.json, reports/gates/]

project-service-verify:
  stage: deploy
  tags: *protected-tags
  allow_failure: false
  rules: *protected-read-rules
  needs: [project-service-deploy-plan, project-service-deploy]
  script:
    - python tools/dcloud_simulator.py verify
  artifacts:
    paths: [reports/simulator/verify.json]

project-service-live-test:
  stage: deploy
  tags: *protected-tags
  allow_failure: false
  rules: *protected-read-rules
  needs: [project-service-deploy-plan, project-service-verify]
  script:
    - python tools/dcloud_simulator.py live-test
  artifacts:
    paths: [reports/simulator/live-test.json]

project-service-rollback:
  stage: deploy
  tags: *protected-tags
  allow_failure: false
  rules: *protected-manual-rules
  needs: [project-service-deploy-plan, project-service-deploy]
  resource_group: redfish-ctl-dmtf-sim
  variables:
    MUTATION_LOCK: redfish-ctl-dmtf-sim
  script:
    - python tools/dcloud_simulator.py rollback --apply
  artifacts:
    when: always
    paths: [reports/simulator/rollback.json, reports/gates/]

project-service-release-evidence:
  stage: publish
  tags: *protected-tags
  allow_failure: false
  rules: *protected-read-rules
  needs: [project-service-deploy-plan, project-service-deploy, project-service-verify, project-service-live-test]
  script:
    - python tools/dcloud_simulator.py evidence
    - ./scripts/gates/evidence/sanitized.sh
  artifacts:
    paths: [reports/simulator/release.json]

# GitHub is the publication authority and DCloud pulls from it. The existing
# export profile still validates the exact mirrored source and publication boundary.
publish-github:
  stage: publish
  tags: *protected-tags
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - <<: *private-api-web
      when: never
    - if: >-
        $CI_PIPELINE_SOURCE != "schedule" &&
        $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH &&
        $CI_COMMIT_REF_PROTECTED == "true"
  script:
    - ./scripts/check.sh --profile repository-export
    - ./scripts/gates/repository/no-secrets.sh
    - ./scripts/gates/evidence/sanitized.sh
    - git fetch github-fixtures "$CI_DEFAULT_BRANCH"
    - test "$(git rev-parse FETCH_HEAD)" = "$CI_COMMIT_SHA"
