# Gated outbound mirror for an already-validated internal default-branch commit.
# Protected default branch only — never a merge request or scheduled canary.
publish-github:
  stage: publish
  tags: [homelab-k8s]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - <<: *private-api-web
      when: never
    - if: >-
        $CI_PIPELINE_SOURCE != "schedule" &&
        $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH &&
        $CI_COMMIT_REF_PROTECTED == "true"
  script:
    # Run the configured repository-export profile, then the publication
    # boundary scans that cannot share that profile.
    - ./scripts/check.sh --profile repository-export
    - ./scripts/gates/repository/no-secrets.sh
    - ./scripts/gates/evidence/sanitized.sh
    - ./scripts/publish_github.sh
